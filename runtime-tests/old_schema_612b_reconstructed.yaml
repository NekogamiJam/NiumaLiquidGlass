# Android-only baseline; the user's desktop schema is never modified.
schema:
  schema_id: niuma_glass
  name: 牛码·固定序
  version: "0.1.0-dev"
  author: Local customization
  description: 两份原始牛码表；关闭调频、造句和前缀补全的固定序基线

switches:
  - name: ascii_mode
    reset: 0
    states: [中, EN]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
  - name: ascii_punct
    reset: 0
    states: [中文标点, 英文标点]

engine:
  processors:
    - ascii_composer
    - lua_processor@*niuma_fourcode
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  max_code_length: 5
  # zc words start a..y; fh symbols start z and retain their five-letter codes.
  auto_select: true
  auto_select_pattern: '^[a-y][a-z]{3}$'
  # Sparse valid prefixes must survive even when exact-match candidates are temporarily empty.
  # With completion disabled, 'manual' would drop such prefixes on the next letter.
  auto_clear: false

translator:
  dictionary: niumawb
  initial_quality: 10000
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  enable_completion: false
  enable_charset_filter: false
  db_class: tabledb

menu:
  page_size: 9

punctuator:
  import_preset: default
  # Keep native numeric-context recognition, but commit '.' / ':' immediately.
  digit_separator_action: commit
key_binder:
  import_preset: default
recognizer:
  import_preset: default
